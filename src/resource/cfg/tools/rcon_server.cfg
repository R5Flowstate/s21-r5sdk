////////////////// rcon_server configuration file.
// Executed on startup (NON -devsdk). -devsdk uses rcon_server_dev.cfg instead --
// keep BOTH files' live values identical (12.B stomped-password root cause).
//
// RCON roles on the S21 bridge (do not collapse them):
//   1) netconsole.exe / remote admin  -- main product (opt-in remote bind)
//   2) bridge elev (game cl_rcon)     -- same-box ImGui changelevel etc.
//   3) MCP dedi tools                 -- AI control (::1 or remote)
// Client-local MCP listen is SEPARATE (client sv_rcon_port 37016).
//
// NEVER commit a real password here -- deploy tree only.

sv_rcon_password         ""                 // !! empty = RCON disabled
sv_rcon_whitelistaddress ""                 // Optional never-ban IP. Example: [::ffff:127.0.0.1]
rcon_key                 ""                 // Base64 AES-128; empty = random (printed). NEVER use the public demo key with encrypt on.
rcon_encryptframes       "1"                // Ship default ON. Lab plaintext: 0 only with loopback bind.

// ---------------------------------------------------------------------------
// Deploy-tree recipe (password never in repo):
//
// sv_rcon_password          "<GENERATED, 20+ char>"
// sv_rcon_useloopbacksocket "1"   // Ship default: loopback ONLY.
//                                 // Remote admin requires ALL of:
//                                 //   sv_rcon_useloopbacksocket 0
//                                 //   rcon_encryptframes 1
//                                 //   rcon_key <operator base64 AES-128 key>
// sv_rcon_sendlogs          "1"
// sv_rcon_maxconnections    "4"   // elev + MCP + netconsole + spare
// sv_bridge_admin_elevation "1"   // Path B game-channel elev (still needs loopback RCON session)
// sv_bridge_admin_passthrough ""
//
// netconsole (encrypted, matches encryptframes 1): connect with address AND key.
//   netconsole.exe
//   > [::1]:37015
//   > KEY <operator base64 key>
//   > PASS <password>
//   > status
// Remote (non-loopback): set useloopbacksocket 0 first; encrypt + operator key required.
